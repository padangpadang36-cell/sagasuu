<script>
/*
 * Show Confirmation dialog
 * @param {string} message
 * @param {string} title
 * @param {function} okFunction
 * @param [function]function cancelFunction
 * @param [boolen] isHtml Message will render as HTML
 * if setMethod = html => we will use .html(message) to append message.
 * if setMethod = text => we will use .text(message) to append message.
 * By default: .html(message);
 * Note:
 * 1) .html(message) ; => support HTML tags (<br/>, <p>...), but you need ensure that your message
 * do not content special characters. If the message contents them, it may break the GUI.
 * 2) .text(message) ; => Can show specical characters on dialog.
 * @returns {showAlert}
 * */
function showWarnDialog(message, title, okFunction, cancelFunction, isHtml, okBtnText, cancelBtnText, hideFlg,fixedHideFlg) {
    okFunction = typeof okFunction !== 'undefined' ? okFunction : null;
    cancelFunction = typeof cancelFunction !== 'undefined' ? cancelFunction : null;
    usedOkFunction = function () {
        okFunction();
        if(!hideFlg){
           $('#warn_dialog').modal('hide');
        }
        if(!fixedHideFlg){
            if($(".bb-fixed-bottom").length>0){
                $(".bb-fixed-bottom").removeClass("hidden");
            } 
        }else{
            $('.unie8').addClass('modal-open');
        }
    };
    if (cancelFunction === null) {
        usedCancelFunction = function () {
            //$('#warn_dialog').modal('hide');
            if($(".bb-fixed-bottom").length>0){
                $(".bb-fixed-bottom").removeClass("hidden");
            }
        };
    } else {
        usedCancelFunction = function () {
            cancelFunction();
            //$('#warn_dialog').modal('hide');
            if($(".bb-fixed-bottom").length>0){
                $(".bb-fixed-bottom").removeClass("hidden");
            }
        };
    }
    if (isHtml === true) {
        $('#warn_dialog .modal-body p').html(message);
    } else {
        $('#warn_dialog .modal-body p').text(message);
    }
    
    if (typeof okBtnText !== 'undefined' && okBtnText!==null && okBtnText.length > 0) {
        $("#btnOk", "#warn_dialog").text(okBtnText);
    } else {
        var text = $("#btnOk", "#warn_dialog").attr("default-text");
        $("#btnOk", "#warn_dialog").text(text);
    }
    if (typeof cancelBtnText !== 'undefined' && cancelBtnText !== null && cancelBtnText.length > 0) {
        $("#btnCancel", "#warn_dialog").text(cancelBtnText);
    } else {
        var text = $("#btnCancel", "#warn_dialog").attr("default-text");
        $("#btnCancel", "#warn_dialog").text(text);
    }

    $('#warn_dialog .modal-title').text(title);
    $('#warn_dialog').modal('show');
    if($(".bb-fixed-bottom").length>0){
        $(".bb-fixed-bottom").addClass("hidden");
    }
    $('#btnOk').focus();
}
$('.warn-dialog').keydown(function(e) {
    if(e.which == 9) { 
        e.preventDefault(); 
        var isFocus=$('#btnOk').is(":focus");
        if(isFocus == true){
            $('#btnCancel').focus();
        }else{
            $('#btnOk').focus();
        }
    }
});
