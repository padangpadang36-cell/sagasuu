function web_entry_message_badge(){
	
	var menu_length = 0;
	
	$('.user_box').find('.icon').each(function(){
		if( $(this).find('img').attr('src') == "/img/web_entry_icon.png" ){
			menu_length++;
		}
	});
	
	if( menu_length > 0 ){
	
		var user_compnay_id = $('#user_compnay_id').val();
		if( user_compnay_id != "" ){
			$.post('./ajax/get_application_count.php',{mediation_company_id:user_compnay_id },function(dd){
				if( dd && dd != "false" ){
					var data = $.parseJSON( dd );

					$('.user_box').find('.icon').each(function(){
						if( $(this).find('img').attr('src') == "/img/web_entry_icon.png" ){
							let cnt = Number(data.contact) + Number(data.njc_contact);
							$(this).append('<span class="badge" style="position: absolute; top: -5px; right: -5px; background-color: #C62C2C; color: #FFF; height: 20px; width: 20px; border-radius:5px; box-shadow:0 0 2px #000;"><span style="display:table-cell; height:20px; width:20px; vertical-align:middle; text-align:center; font-size: 12px; font-weight: bold;">'+cnt+'</span></span>');
							if( Number(data.njc_contact) > 0 ){
								$('#njc_unread_badge').append('<span class="badge" style="position: absolute; top: -5px; right: 5px; background-color: #C62C2C; color: #FFF; height: 20px; width: 20px; border-radius:5px; box-shadow:0 0 2px #000;"><span style="display:table-cell; height:20px; width:20px; vertical-align:middle; text-align:center; font-size: 12px; font-weight: bold;">'+data.njc_contact+'</span></span>');
							}
						}
					});
				}
			});
		}
	
	}
}

	window.open(url, '_blank')
